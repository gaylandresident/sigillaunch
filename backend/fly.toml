app = "sigil-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[env]
  PORT = "3001"
  LOG_LEVEL = "info"
  ROBINHOOD_RPC_URL = "https://robinhood-mainnet.g.alchemy.com/v2/alch_mkS7FTQnzPCIou3V7eI3c"
  BURN_REGISTRY_ADDRESS = "0x0e053063132b90b9a98efc4846968f24c11061cd"
  CERTIFICATE_ADDRESS = "0xf6f842d392dd776ba7e8f6c46804aff9fe05e4af"
  LAUNCHPAD_ADDRESS = "0xb82d1356e77e301041add2ef53bbcaf428b5be53"
  REWARD_VAULT_ADDRESS = "0x46ab4f6ad1bfda11385cda92adee20d1d5dbc751"
  ETHEREUM_RPC_URL = "https://eth.llamarpc.com"
  BASE_RPC_URL = "https://mainnet.base.org"
  BSC_RPC_URL = "https://bsc-dataseed.binance.org"
  ARBITRUM_RPC_URL = "https://arb1.arbitrum.io/rpc"
  SOLANA_RPC_URL = "https://api.mainnet-beta.solana.com"
  EVM_DEAD_ADDRESS = "0x000000000000000000000000000000000000dEaD"
  SOLANA_DEAD_ADDRESS = "11111111111111111111111111111112"
  ZSA_ISSUER_ACCOUNT = "0"

# Secrets set via `flyctl secrets`:
#   DATABASE_URL
#   ATTESTER_PRIVATE_KEY
#   ZSA_ISSUER_MNEMONIC
